<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, responsive calculator application built to practice Git and CI/CD pipelines.">
  <title>Modern Calculator | CI/CD DevOps Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-decorations">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="calculator-app">
    <header class="app-header">
      <div class="badge">
        <span class="status-dot"></span> CI/CD Demo
      </div>
      <h1 class="app-title">Simple Calculator</h1>
      <p class="app-subtitle">Automated Testing & GitHub Actions Pipeline</p>
    </header>

    <div class="calculator-card" id="calculator">
      <!-- Screen Display -->
      <section class="display-panel" aria-label="Calculator display">
        <div class="previous-operand" id="previous-operand" aria-live="polite"></div>
        <div class="current-operand" id="current-operand" aria-live="polite">0</div>
      </section>

      <!-- Keypad -->
      <section class="keypad-grid" aria-label="Calculator keys">
        <button type="button" class="btn btn-action" id="btn-clear" data-action="clear">AC</button>
        <button type="button" class="btn btn-action" id="btn-delete" data-action="delete">DEL</button>
        <button type="button" class="btn btn-action" id="btn-percent" data-action="percent">%</button>
        <button type="button" class="btn btn-operator" id="btn-divide" data-operator="÷">÷</button>

        <button type="button" class="btn btn-number" id="btn-7" data-number="7">7</button>
        <button type="button" class="btn btn-number" id="btn-8" data-number="8">8</button>
        <button type="button" class="btn btn-number" id="btn-9" data-number="9">9</button>
        <button type="button" class="btn btn-operator" id="btn-multiply" data-operator="×">×</button>

        <button type="button" class="btn btn-number" id="btn-4" data-number="4">4</button>
        <button type="button" class="btn btn-number" id="btn-5" data-number="5">5</button>
        <button type="button" class="btn btn-number" id="btn-6" data-number="6">6</button>
        <button type="button" class="btn btn-operator" id="btn-subtract" data-operator="-">−</button>

        <button type="button" class="btn btn-number" id="btn-1" data-number="1">1</button>
        <button type="button" class="btn btn-number" id="btn-2" data-number="2">2</button>
        <button type="button" class="btn btn-number" id="btn-3" data-number="3">3</button>
        <button type="button" class="btn btn-operator" id="btn-add" data-operator="+">+</button>

        <button type="button" class="btn btn-number btn-zero" id="btn-0" data-number="0">0</button>
        <button type="button" class="btn btn-number" id="btn-decimal" data-action="decimal">.</button>
        <button type="button" class="btn btn-equals" id="btn-equals" data-action="calculate">=</button>
      </section>
    </div>

    <!-- CI/CD Quick Info Footer -->
    <footer class="app-footer">
      <div class="ci-status-box">
        <span class="icon">🚀</span>
        <div>
          <strong>GitHub Actions Ready</strong>
          <p>Runs automated unit tests on every <code>git push</code></p>
        </div>
      </div>
    </footer>
  </main>

  <!-- Load core calculator logic, then app interaction -->
  <script src="src/calculator.js"></script>
  <script src="script.js"></script>
</body>
</html>
